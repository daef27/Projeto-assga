{% extends 'associacao/base.html' %}
{% load static %}

{% block title %}Notícia{% endblock %}

{% block content %}

<style>
.noticia-detalhe{
    max-width:900px;
    margin:40px auto;
    padding:25px;
    background:white;
    border-radius:18px;
    box-shadow:0 15px 40px rgba(0,0,0,0.08);
}
.noticia-detalhe img{
    width:100%;
    height:380px;
    object-fit:cover;
    border-radius:15px;
    margin-bottom:20px;
}
.noticia-detalhe h2{
    color:#0048ff;
    margin-bottom:15px;
}
.noticia-detalhe p{
    color:#333;
    line-height:1.8;
    margin-bottom:20px;
}
.noticia-meta{
    display:flex;
    justify-content:space-between;
    gap:10px;
    flex-wrap:wrap;
    color:#555;
    font-weight:600;
}
</style>

<section class="noticia-detalhe">
    {% if noticia.imagem %}
        <img src="{{ noticia.imagem.url }}" alt="{{ noticia.titulo }}">
    {% endif %}
    <h2>{{ noticia.titulo }}</h2>
    <div class="noticia-meta">
        <span>📅 {{ noticia.data|date:"d/m/Y" }}</span>
        <span>⏰ {{ noticia.data|time:"H:i" }}</span>
    </div>
    <p>{{ noticia.texto }}</p>
    <a href="{% url 'noticias' %}" class="btn-noticia">Voltar às notícias</a>
</section>

{% endblock %}
